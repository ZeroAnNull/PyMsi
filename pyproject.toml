[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyMsi"
version = "1.4.5"
description = "文件夹→MSI | HTML→EXE (Electron) | 30+内置游戏 | Hex解析 | AI空壳 — 像 PyInstaller 一样简单"
readme = {text = "PyMsi - 文件夹→MSI | HTML→EXE | 30+内置游戏 | Hex解析 | AI空壳\n===========================================\n\n用法:\n    import PyMsi as PM\n    \n    # 文件夹 → MSI\n    PM(\"C:/your_folder\")\n    PM.s(2)  # 极速模式\n    \n    # HTML → EXE (像 Electron)\n    PM.html(\"C:/html_project\")\n    PM.html.sandbox(True)\n    PM.html.build()\n    \n    # 30+ 内置游戏\n    PM.game.Grap(\"Snake\")\n    PM.game.list()\n    \n    # 文件 Hex 解析\n    PM.hex(\"C:/file.bin\")\n    \n    # AI 空壳 (设 key + url 后问问题)\n    PM.ai.key = 'sk-xxx'\n    PM.ai.url = 'https://api.openai.com'\n    PM.ai.imput('你好')\n", content-type = "text/plain"}
requires-python = ">=3.7"
authors = [{name = "PyMsi"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/pymsi/pymsi"